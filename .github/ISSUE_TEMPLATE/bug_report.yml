name: "Bug report"
description: "Report a problem with LeaseEditor-Dnsmasq"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove passwords, API keys, public IP addresses, MAC addresses, and other sensitive network details before posting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that a similar issue has not already been reported.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start LeaseEditor-Dnsmasq...
        2. Open the application...
        3. Describe what happens...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Docker Compose
        - Docker
        - Native Linux binary
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: "e.g. commit hash or release tag"
    validations:
      required: false
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      placeholder: "e.g. Raspberry Pi OS 64-bit, ARM64"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove sensitive information before posting.
      render: text
    validations:
      required: false
