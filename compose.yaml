services:
  leaseeditor-dnsmasq:
    build: .
    container_name: leaseeditor-dnsmasq
    restart: unless-stopped
    environment:
      LOG_LEVEL: "INFO"
    ports:
      - "3009:3009"
    volumes:
      # Native und Docker verwenden dieselbe Konfiguration.
      - ./config.yaml:/app/config.yaml:ro
      # Bei Bedarf den tatsächlichen Speicherort anpassen.
      - /var/lib/dnsmasq:/var/lib/dnsmasq:rw
